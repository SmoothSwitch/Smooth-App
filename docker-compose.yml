###############################################################################
# SmoothSwitch – Monitoring & Observability Stack
# Deliverables: D1 (Prometheus + Grafana), D3 (Jaeger)
###############################################################################

services:
  # ─────────────────────────── Prometheus ───────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: smoothswitch-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

  # ─────────────────────────── Alertmanager ─────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: smoothswitch-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring

  # ─────────────────────────── Grafana ─────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: smoothswitch-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=smoothswitch2026
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ─────────────────────────── Jaeger (D3) ─────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: smoothswitch-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - monitoring

  # ─────────────────────────── PostgreSQL ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smoothswitch-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-smoothswitch}
      - POSTGRES_USER=${DB_USER:-smoothswitch}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-smoothswitch_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring

  # ─────────────────────────── Redis ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smoothswitch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - monitoring

  # ─────────────────────────── Auth Service (Go + Gin) ───────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: smoothswitch-auth-service
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - GIN_MODE=release
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-smoothswitch}
      - DB_USER=${DB_USER:-smoothswitch}
      - DB_PASSWORD=${DB_PASSWORD:-smoothswitch_secret}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
    depends_on:
      - postgres
      - redis
    networks:
      - monitoring

  # ─────────────────────────── SIM Service (Go + gRPC) ───────────
  sim-service:
    build:
      context: ./backend/sim-service
      dockerfile: Dockerfile
    container_name: smoothswitch-sim-service
    restart: unless-stopped
    ports:
      - "50051:50051"
    environment:
      - PORT=50051
    networks:
      - monitoring

  # ─────────────────────────── Location Advisory (Go + Gin) ────
  location-advisory:
    build:
      context: ./backend/location-advisory
      dockerfile: Dockerfile
    container_name: smoothswitch-location-advisory
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GIN_MODE=release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - redis
    networks:
      - monitoring

  # ─────────────────────────── MNO Integration (Go + Gin) ────
  mno-integration:
    build:
      context: ./backend/mno-integration
      dockerfile: Dockerfile
    container_name: smoothswitch-mno-integration
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - GIN_MODE=release
      - MTN_API_URL=https://api.mtn.ng
      - GLO_API_URL=https://api.gloworld.com
      - AIRTEL_API_URL=https://api.airtel.com.ng
      - NINEMOBILE_API_URL=https://api.9mobile.com.ng
    networks:
      - monitoring

  # ─────────────────────────── Datadog Agent ───────────────────────
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: smoothswitch-datadog-agent
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.eu}
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - "8125:8125/udp" # StatsD
      - "8126:8126/tcp" # APM Traces
    networks:
      - monitoring

# ─────────────────────────── Volumes ───────────────────────────────
volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:

# ─────────────────────────── Networks ──────────────────────────────
networks:
  monitoring:
    driver: bridge
