syntax = "proto3";

package com.smoothswitch.sim.grpc;

option java_multiple_files = true;
option java_package = "com.smoothswitch.sim.grpc";
option java_outer_classname = "SwitchProto";

// Defines the interface exposed by the SIM Service to the NIE Engine
service SwitchService {
    // Executes a network switch command
    rpc ExecuteSwitch (SwitchCommand) returns (SwitchResult) {}
}

message SwitchCommand {
    string session_id = 1;
    string target_imsi = 2;
    string target_carrier = 3;
    string reason = 4;
    string sim_type = 5; // "physical" or "esim"
}

message SwitchResult {
    bool success = 1;
    string error_message = 2;
    int32 duration_ms = 3;
}
